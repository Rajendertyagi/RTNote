name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "Which tests to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - backend-only
          - e2e-only

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'backend-only'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app main.py

      - name: Run tests
        run: pytest tests/ --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'e2e-only'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --config tests/playwright.config.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
