# Pragmatic lint profile: catch real defects (unused imports/vars, undefined
# names, bad comparisons, syntax errors) without style churn on legacy code.
line-length = 120
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Test fixtures keep explicit imports even when a test doesn't use them.
"tests/*" = ["F401", "F811"]
