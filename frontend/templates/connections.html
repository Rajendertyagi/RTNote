<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connections — RTW</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/chat.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css">
</head>
<body>
    <div class="conn-app">
        <header class="conn-header">
            <h2><i class='bx bx-plug'></i> AI Connections</h2>
            <div class="conn-header__actions">
                <a href="/chat" class="btn-sm"><i class='bx bx-left-arrow-alt'></i> Back to chat</a>
            </div>
        </header>
        <p class="conn-sub">Save API keys and base URLs per provider. Keys are stored locally in
            <code>data/connections.json</code> and never returned unmasked by the API.</p>

        <div class="conn-grid" id="providerGrid"></div>
    </div>

    <template id="providerCardTpl">
        <div class="conn-card">
            <div class="conn-card__head">
                <span class="conn-card__name"></span>
                <span class="conn-status"></span>
            </div>
            <label>API key
                <input type="password" class="conn-key" autocomplete="off" spellcheck="false">
            </label>
            <label>Base URL <span class="opt">(optional)</span>
                <input type="text" class="conn-url" placeholder="https://…" spellcheck="false">
            </label>
            <div class="conn-card__actions">
                <button class="btn-sm conn-save">Save</button>
                <button class="btn-sm conn-test">Test</button>
                <button class="btn-sm conn-clear-key" hidden title="Clear the saved API key">Clear key</button>
                <button class="btn-sm conn-del" title="Remove saved credentials"><i class='bx bx-trash'></i></button>
                <span class="conn-result"></span>
            </div>
        </div>
    </template>

    <script src="/static/js/connections.js?v=1"></script>
</body>
</html>
